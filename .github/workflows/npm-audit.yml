name: Library security check

# npm audit (#97): checks the test libraries (Playwright, supabase-js, pg,
# dotenv) against the public list of known security holes. Fails on
# high/critical only; a failure sends GitHub's usual "run failed" email.
#
# Kept separate from the Playwright workflow on purpose, so a red test run
# always means a broken test, never "a library got a new advisory".
# Runs when the library list changes and every Monday, so a new advisory is
# caught even when nobody pushes for weeks. Dependabot also emails security
# alerts as they are published.

on:
  push:
    branches: [main]
    paths:
      - 'tests-playwright/package*.json'
      - '.github/workflows/npm-audit.yml'
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Check libraries for known security holes
        working-directory: tests-playwright
        run: npm audit --audit-level=high
