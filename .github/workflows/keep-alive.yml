name: Keep Supabase Awake

# Free-tier Supabase projects auto-pause after 7 days with no API activity
# (#19). This pings both the test and production projects every 3 days —
# well inside that window, with margin for GitHub's scheduled jobs not being
# second-precise. The ping calls lookup_customer with a nonsense email via
# the public anon key (same key already shipped in index.html) — a
# read-only RPC that already exists for the public booking flow, returns an
# empty result for an unknown email, and touches no table data. The bare
# REST API root (/rest/v1/) was tried first but now 401s for anon keys
# (UNAUTHORIZED_INVALID_API_KEY_TYPE — introspection is service_role-only on
# this gateway version), so an anon-permitted RPC call is used instead.

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping production Supabase
        run: |
          curl -sf -o /dev/null -w "prod: %{http_code}\n" \
            -X POST "https://mrlooyixnlxzcfmvnqme.supabase.co/rest/v1/rpc/lookup_customer" \
            -H "apikey: ${PROD_ANON_KEY}" \
            -H "Authorization: Bearer ${PROD_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"p_email":"keepalive-ping@example.invalid"}'
        env:
          PROD_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ybG9veWl4bmx4emNmbXZucW1lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5MTM2MDAsImV4cCI6MjA4ODQ4OTYwMH0.k1LbLenXS29NosaayGnQn3SR2G1xXVDBICeH7w7bD_c

      - name: Ping test Supabase
        run: |
          curl -sf -o /dev/null -w "test: %{http_code}\n" \
            -X POST "https://ngzfhamjuviwfwuncrjo.supabase.co/rest/v1/rpc/lookup_customer" \
            -H "apikey: ${TEST_ANON_KEY}" \
            -H "Authorization: Bearer ${TEST_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"p_email":"keepalive-ping@example.invalid"}'
        env:
          TEST_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5nemZoYW1qdXZpd2Z3dW5jcmpvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1OTM1ODksImV4cCI6MjA5MjE2OTU4OX0.okVYL1VLSDd3I7nD5VPuUCOZmY_G7mzC4o3Y3lx16Pg
