<title>LG Pilates Training Hub</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;600;700&family=Open+Sans:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: handbook — sticky lesson index on the left, one lesson at a time on the right (stacks on phones). */
:root {
  --bg: #f4f6f4; --surface: #ffffff; --ink: #1f2a27; --muted: #5a6964; --line: #dbe3df;
  --sage: #3f6e60; --sage-soft: #e3eee9; --amber: #8a5a14; --amber-soft: #fbf0dc;
  --red: #b83b3b; --red-soft: #fbe9e9; --done: #2f7a4f;
  --display: "Raleway", "Helvetica Neue", Arial, sans-serif;
  --body: "Open Sans", "Segoe UI", Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121816; --surface: #1a2320; --ink: #e6ece9; --muted: #9eb0a9; --line: #2b3733;
  --sage: #82b8a6; --sage-soft: #1f302a; --amber: #e3b56c; --amber-soft: #2c2417;
  --red: #ec8a8a; --red-soft: #2e1c1c; --done: #7fcf9f; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121816; --surface: #1a2320; --ink: #e6ece9; --muted: #9eb0a9; --line: #2b3733;
  --sage: #82b8a6; --sage-soft: #1f302a; --amber: #e3b56c; --amber-soft: #2c2417;
  --red: #ec8a8a; --red-soft: #2e1c1c; --done: #7fcf9f; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.6; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px;
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
@media (min-width: 900px) { .wrap { grid-template-columns: 290px minmax(0, 1fr); gap: 40px; padding-inline: 24px; } }

/* Index */
.index { min-width: 0; }
@media (min-width: 900px) { .index { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start; max-height: calc(100vh - 32px); overflow-y: auto; } }
.brand { font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: .01em; margin: 0; }
.brand span { color: var(--sage); font-style: italic; font-weight: 600; }
.brand-sub { color: var(--muted); font-size: 13px; margin: 2px 0 16px; }
details.nav { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
details.nav > summary { list-style: none; cursor: pointer; padding: 12px 14px; font-weight: 600; font-size: 14px; display: flex; justify-content: space-between; }
details.nav > summary::-webkit-details-marker { display: none; }
@media (min-width: 900px) { details.nav > summary { display: none; } details.nav { background: none; border: 0; } }
.nav-body { padding: 4px 8px 12px; display: grid; gap: 14px; }
@media (min-width: 900px) { .nav-body { padding: 0; } }
.nav-part h3 { font-family: var(--display); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px 10px; }
.nav-part ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.nav-link { width: 100%; text-align: left; background: none; border: 0; font: inherit; font-size: 14px; color: var(--ink);
  padding: 7px 10px; border-radius: 6px; cursor: pointer; display: grid; grid-template-columns: 20px 1fr; gap: 8px; align-items: start; line-height: 1.4; }
.nav-link:hover { background: var(--sage-soft); }
.nav-link[aria-current="true"] { background: var(--sage-soft); color: var(--sage); font-weight: 600; }
.nav-link:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--sage); outline-offset: 2px; }
.tick { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--line); margin-top: 2px; display: grid; place-items: center; font-size: 10px; color: transparent; }
.tick.on { background: var(--done); border-color: var(--done); color: var(--surface); }
.nav-soon { font-size: 13px; color: var(--muted); padding: 4px 10px 0 38px; font-style: italic; }
.nav-part .nav-soon-list { font-size: 13px; color: var(--muted); padding: 2px 10px 0 38px; margin: 0; list-style: none; opacity: .75; }

/* Main */
main { min-width: 0; }
.page { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 22px 18px 28px; }
@media (min-width: 600px) { .page { padding: 32px 40px 40px; } }
.eyebrow { font-family: var(--display); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--sage); margin: 0 0 6px; }
h1 { font-family: var(--display); font-weight: 600; font-size: clamp(24px, 3.6vw, 32px); line-height: 1.2; margin: 0 0 18px; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 700; font-size: 17px; margin: 30px 0 10px; }
p, li { max-width: 68ch; }
.situation { border-left: 3px solid var(--sage); background: var(--sage-soft); padding: 12px 16px; border-radius: 0 6px 6px 0; margin: 0 0 8px; font-style: italic; }
ol.steps { padding-left: 0; list-style: none; counter-reset: s; display: grid; gap: 10px; margin: 0; }
ol.steps > li { counter-increment: s; position: relative; padding-left: 38px; min-height: 26px; }
ol.steps > li::before { content: counter(s); font-family: var(--display); font-weight: 700; font-size: 13px; width: 26px; height: 26px; border-radius: 50%; background: var(--sage); color: var(--surface); display: grid; place-items: center; position: absolute; left: 0; top: 1px; }
.ui { font-weight: 600; white-space: nowrap; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: .92em; background: var(--bg); }
.pill { font-size: 13px; padding: 1px 9px; border-radius: 99px; white-space: nowrap; }
.pill.res { background: var(--amber-soft); color: var(--amber); }
.pill.con { background: var(--sage-soft); color: var(--done); }
figure { margin: 16px 0; }
figure img { display: block; max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 6px; }
figcaption { font-size: 13px; color: var(--muted); margin-top: 6px; }
.status-table { overflow-x: auto; max-width: 100%; }
.status-table tbody th { text-transform: none; letter-spacing: 0; font-size: 14px; color: var(--ink); white-space: nowrap; padding-right: 16px; }
table { border-collapse: collapse; font-size: 14px; min-width: 420px; }
th, td { text-align: left; padding: 8px 12px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.tryit { margin-top: 30px; border: 1.5px dashed var(--sage); border-radius: 8px; padding: 16px 18px; display: grid; gap: 10px; }
.tryit h2 { margin: 0; }
.tryit p { margin: 0; }
.btn { display: inline-flex; align-items: center; gap: 8px; font: 600 14px var(--body); border-radius: 6px; padding: 9px 16px; cursor: pointer; text-decoration: none; border: 1.5px solid var(--sage); }
.btn.primary { background: var(--sage); color: var(--surface); }
.btn.ghost { background: none; color: var(--sage); }
.btn[disabled] { opacity: .5; cursor: default; }
.watch { margin-top: 26px; background: var(--amber-soft); border-radius: 8px; padding: 14px 18px; }
.watch h2 { margin: 0 0 6px; color: var(--amber); }
.watch ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.lesson-foot { margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.done-btn.on { background: var(--done); border-color: var(--done); color: var(--surface); }
.pager { display: flex; gap: 8px; flex-wrap: wrap; }
.note { font-size: 13px; color: var(--muted); }
.banner-demo { background: var(--red); color: #fff; font-weight: 600; font-size: 13px; text-align: center; padding: 6px 10px; border-radius: 4px; }
.cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin-top: 8px; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; min-width: 0; }
.card h3 { font-family: var(--display); font-size: 15px; margin: 0 0 4px; }
.card p { margin: 0; font-size: 14px; color: var(--muted); }
.team { display: grid; gap: 10px; margin-top: 8px; }
.person { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.person img { width: 32px; height: 32px; border-radius: 50%; }
.bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 4px; }
.bar > i { display: block; height: 100%; background: var(--done); }
.num { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); }
.reset { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.reset:empty { display: none; }
.linkbtn { background: none; border: 0; padding: 0; font: 13px var(--body); color: var(--muted); text-decoration: underline; cursor: pointer; }
.btn.danger { background: var(--red); border-color: var(--red); color: #fff; }
[hidden] { display: none !important; }
</style>

<div class="wrap">
  <aside class="index">
    <p class="brand">LG <span>Pilates</span> Training Hub</p>
    <p class="brand-sub">Learn the booking system by doing it</p>
    <details class="nav" id="nav">
      <summary>Lessons <span id="nav-count" class="num"></span></summary>
      <div class="nav-body" id="nav-body"></div>
    </details>
  </aside>
  <main id="main"></main>
</div>

<!-- ───────────── Lesson content ───────────── -->
<template id="L-start">
  <p class="eyebrow">Start here</p>
  <h1>How this hub works</h1>
  <p>Each lesson starts with a real situation, like a client emailing to say they can't come. It then walks you through what to do in the booking system, step by step.</p>
  <div class="cards">
    <div class="card"><h3>1. Read the steps</h3><p>Each lesson is short, around five minutes, with pictures of the real screens.</p></div>
    <div class="card"><h3>2. Try it for real</h3><p>The <strong>Try it</strong> button opens a practice copy of the booking system. Nothing you do there affects real clients.</p></div>
    <div class="card"><h3>3. Tick it off</h3><p>Press <strong>Mark as done</strong> at the bottom of each lesson. Your progress is saved.</p></div>
  </div>

  <h2>The practice copy</h2>
  <p>The practice copy looks and works exactly like the real system, with one difference: a red bar across the top.</p>
  <div class="banner-demo" aria-hidden="true">⚠️ TEST MODE — connected to lg-pilates-test (isolated test data)</div>
  <p>If you see that red bar, you're safe. Practice bookings are made up, no real emails go out, and card payments use pretend cards. <strong>If the red bar isn't there, stop.</strong> You're on the real system.</p>
  <ol class="steps">
    <li>Press any <strong>Try it</strong> button. The practice copy opens in a new tab.</li>
    <li>Scroll to the very bottom of the page and click <span class="ui">Dashboard</span>.</li>
    <li>Log in with your <strong>practice login</strong>. Mark will give you this. It's different from the real one, and your real login won't work here.</li>
  </ol>
  <div class="watch">
    <h2>Good to know</h2>
    <ul>
      <li>The practice copy is reset every time Mark runs his automated checks. If a practice booking you made has vanished, that's normal.</li>
      <li>The clients on the practice copy have odd names like "Returning Two" or "SE15 CancelTest". They're test accounts, not real people.</li>
    </ul>
  </div>

  <h2>Progress</h2>
  <div id="team" class="team"><p class="note">Loading progress…</p></div>
  <div id="reset" class="reset"></div>
</template>

<template id="L-1.1">
  <p class="eyebrow">Part 1 · The client's journey · Lesson 1.1</p>
  <h1>How a client finds and books a class</h1>
  <p class="situation">Sarah has seen the Monday class on the website and wants to join. What does she see, and what does she have to do?</p>
  <p>Clients don't book single sessions. They book a <strong>block</strong>, a run of weekly classes such as 6 Mondays in a row. One booking covers every week of the block.</p>
  <h2>What the client does</h2>
  <ol class="steps">
    <li>On the booking page, each class has a card showing the day and time, the venue, how many spaces are left, the dates in the block and the price.</li>
    <li>She clicks <span class="ui">Book Current Block</span>. The booking form opens.</li>
    <li><strong>Step 1: her details.</strong> Name, email and phone. The system uses her email to check whether she has booked before.</li>
    <li><strong>New clients</strong> then fill in the health form and an emergency contact (lesson 1.4). <strong>Returning clients</strong> skip straight to payment.</li>
    <li><strong>Last step: payment.</strong> She ticks to agree the terms and conditions, then pays by card or gets bank details (lesson 1.3).</li>
  </ol>
  <figure>
    <img src="{{img:p1-card}}" alt="A class card: Mixed Ability, Monday 9:45 to 10:30am, Baildon, 12 spaces left, 6 dates, £60, Book Current Block button" loading="lazy" style="max-width:380px">
    <figcaption>A class card as a client sees it on their phone.</figcaption>
  </figure>
  <figure>
    <img src="{{img:p1-step1}}" alt="Booking form step 1 of 4: first name, last name, email and phone, with a Continue button" loading="lazy" style="max-width:380px">
    <figcaption>Step 1 of the booking form. New clients have 4 steps; returning clients have 2.</figcaption>
  </figure>
  <h2>Joining partway through a block</h2>
  <p>If the block has already started, the client only pays for the sessions still to come. Past dates are greyed out on the card, and a note says how many sessions are left. The price is worked out automatically, so you don't need to do anything.</p>
  <div class="tryit">
    <h2>Try it</h2>
    <p>On the practice copy, book yourself onto any class as a <strong>new client</strong>. Use a made-up name and an email you haven't used before, such as <em>yourname1@test.example</em>. Go through every step. Then book a second class with the <strong>same email</strong> and notice the health form is skipped.</p>
    <div><a class="btn primary" data-try href="#">Open the practice copy ↗</a></div>
  </div>
  <div class="watch">
    <h2>Watch out for</h2>
    <ul>
      <li>A class only shows a Book button if there's space. A full class shows <span class="ui">Join Waiting List</span> instead (lesson 1.5).</li>
      <li>If someone is already booked on that block and tries again, the form tells them so and stops.</li>
      <li>If the last space goes while someone is still filling in the form, they're told the class is full. The system never double-books a seat.</li>
    </ul>
  </div>
</template>

<template id="L-1.2">
  <p class="eyebrow">Part 1 · The client's journey · Lesson 1.2</p>
  <h1>The priority booking window</h1>
  <p class="situation">Next term's Thursday block is coming up. Your regulars want to be sure of their place before it opens to everyone.</p>
  <p>Each class card has a <strong>Next Block</strong> section at the bottom. It opens in three stages, counted back from the day the block starts:</p>
  <div class="status-table">
    <table>
      <thead><tr><th>When</th><th>Who can book</th><th>What the card shows</th></tr></thead>
      <tbody>
        <tr><td>More than 2 weeks before</td><td>Nobody yet</td><td>🔒 Not open yet, with the key dates</td></tr>
        <tr><td>2 weeks before</td><td>Priority clients only</td><td>⭐ Priority booking is open, plus a box to enter their email</td></tr>
        <tr><td>1 week before</td><td>Everyone</td><td>📅 Book Next Block button</td></tr>
      </tbody>
    </table>
  </div>
  <h2>Who has priority?</h2>
  <ul>
    <li><strong>Automatically:</strong> anyone with a confirmed booking on the class's current block.</li>
    <li><strong>By hand:</strong> you can give someone priority for a particular class on the <span class="ui">Clients</span> page. This suits someone who missed a term but is a regular.</li>
  </ul>
  <h2>What the client does during the priority window</h2>
  <ol class="steps">
    <li>She opens <strong>Next Block</strong> on the class card.</li>
    <li>She types the email she booked with and clicks <span class="ui">Check My Priority</span>.</li>
    <li>If she has priority, she sees "Priority confirmed!" and the booking form opens with her email filled in.</li>
    <li>If not, she's told the date standard booking opens.</li>
  </ol>
  <figure>
    <img src="{{img:p1-priority}}" alt="Class card with Next Block opened: Not open yet, priority booking opens 13 Oct, standard booking opens 20 Oct, block starts 27 Oct" loading="lazy" style="max-width:380px">
    <figcaption>A next block that isn't open yet. The card shows clients exactly when each stage opens.</figcaption>
  </figure>
  <div class="tryit">
    <h2>Try it</h2>
    <p>On the practice copy, open <strong>Next Block</strong> on each class card and find which stage each one is in. Then, in the Dashboard, open <strong>Clients</strong> and find where you would give someone priority by hand.</p>
    <div><a class="btn primary" data-try href="#">Open the practice copy ↗</a></div>
  </div>
  <div class="watch">
    <h2>Watch out for</h2>
    <ul>
      <li>Priority only counts a <em>confirmed</em> booking. A client who reserved by bank transfer but hasn't been confirmed yet won't have priority. Confirm payments promptly (lesson 2.2).</li>
      <li>Priority is per class. Being a Monday regular doesn't give priority on Thursdays.</li>
      <li>The windows are worked out from the block's start date, so they move automatically when you add a new block.</li>
    </ul>
  </div>
</template>

<template id="L-1.3">
  <p class="eyebrow">Part 1 · The client's journey · Lesson 1.3</p>
  <h1>Paying: card or bank transfer</h1>
  <p class="situation">A client reaches the last step of the booking form. How do they pay, and what happens next?</p>
  <p>The system takes <strong>one</strong> kind of payment at a time. You choose which in <span class="ui">Settings</span> (Part 4).</p>
  <div class="status-table">
    <table>
      <thead><tr><th></th><th>Bank transfer</th><th>Card</th></tr></thead>
      <tbody>
        <tr><td>What the client sees</td><td>Your bank details and a payment reference, and a button to <strong>Reserve my spot</strong></td><td>A button that takes them to a secure card payment page</td></tr>
        <tr><td>Booking status</td><td><span class="pill res">reserved</span> until you confirm</td><td><span class="pill con">confirmed</span> as soon as they've paid</td></tr>
        <tr><td>What you do</td><td>Check the bank and click Confirm (lesson 2.2)</td><td>Nothing</td></tr>
      </tbody>
    </table>
  </div>
  <h2>Bank transfer, step by step</h2>
  <ol class="steps">
    <li>The client sees your bank details and is asked to pay within 48 hours.</li>
    <li>The <strong>reference</strong> is their name plus the class day, such as <em>Sam Example Monday</em>. That's what you'll look for on your bank statement.</li>
    <li>They tick to agree the terms and click <span class="ui">Reserve my spot</span>. Their place is held, but not confirmed.</li>
    <li>When the money arrives, you click Confirm and they get a confirmation email.</li>
  </ol>
  <figure>
    <img src="{{img:p1-payment-top}}" alt="Payment step: Reserve your space notice, bank details with name, sort code, account number and reference Sam Example Monday" loading="lazy" style="max-width:380px">
    <figcaption>Bank transfer mode. (The practice copy shows pretend bank details.)</figcaption>
  </figure>
  <div class="tryit">
    <h2>Try it</h2>
    <p>On the practice copy, book any class. If you see bank details, note the reference, reserve, then Confirm the booking in the Dashboard. If you're sent to a card page instead, use the pretend card <strong>4242 4242 4242 4242</strong>, any future expiry date and any 3 digits.</p>
    <div><a class="btn primary" data-try href="#">Open the practice copy ↗</a></div>
  </div>
  <div class="watch">
    <h2>Watch out for</h2>
    <ul>
      <li>Your real bank details must be entered in Settings before real clients book (Part 4).</li>
      <li>Card payments are still in practice mode on the real system too, until the launch step that switches on real payments.</li>
      <li>The price shown, the price charged and the amount recorded are always the same figure, including for part-blocks.</li>
    </ul>
  </div>
</template>

<template id="L-1.4">
  <p class="eyebrow">Part 1 · The client's journey · Lesson 1.4</p>
  <h1>The health form (PAR-Q)</h1>
  <p class="situation">A first-time client is booking. Before they can pay, they're asked about their health.</p>
  <p>The PAR-Q is a standard health questionnaire. It makes sure new clients are well enough to exercise, and it gives you an emergency contact.</p>
  <h2>What the client fills in</h2>
  <ol class="steps">
    <li><strong>Age.</strong> Clients must be 18 or over, and the form won't continue otherwise.</li>
    <li><strong>A list of yes/no health questions</strong>, such as heart problems, blood pressure and recent surgery.</li>
    <li>If they answer <strong>yes</strong> to anything, they must describe it. The form advises them to check with their doctor before joining.</li>
    <li>They type their name and tick the declaration.</li>
    <li><strong>Emergency contact:</strong> name, relationship and phone number.</li>
  </ol>
  <figure>
    <img src="{{img:p1-healthform}}" alt="Booking form step 2 of 4, medical questions: age box and yes or no questions about heart, circulation and blood pressure problems" loading="lazy" style="max-width:380px">
    <figcaption>Step 2 of 4 for new clients.</figcaption>
  </figure>
  <h2>Who has to fill it in?</h2>
  <p>Only <strong>new clients</strong>, once. When someone books again with the same email, the system recognises them and skips the form.</p>
  <div class="tryit">
    <h2>Try it</h2>
    <p>On the practice copy, book as a brand-new client and answer <strong>yes</strong> to one question, to see what the form asks next. Use a made-up email you haven't used before.</p>
    <div><a class="btn primary" data-try href="#">Open the practice copy ↗</a></div>
  </div>
  <div class="watch">
    <h2>Watch out for</h2>
    <ul>
      <li>If a new client's booking somehow has no health form, a warning appears at the top of <strong>All bookings</strong>. Click it to find the booking, and ask the client to fill one in before class.</li>
      <li>Health answers are sensitive personal information. Only look at them when you need to.</li>
      <li>Joining a waiting list doesn't count as having done the form. They'll still fill it in when they book.</li>
    </ul>
  </div>
</template>

<template id="L-1.5">
  <p class="eyebrow">Part 1 · The client's journey · Lesson 1.5</p>
  <h1>Joining a waiting list, and accepting an offer</h1>
  <p class="situation">The Monday class is full. A client would still like a place if one comes up.</p>
  <h2>Joining the list</h2>
  <ol class="steps">
    <li>A full class shows <span class="ui">Join Waiting List</span> instead of a Book button. The card also shows how many people are already waiting.</li>
    <li>The client enters their name, email and phone, and clicks <span class="ui">Join the waiting list</span>.</li>
    <li>They see <strong>"You're on the list"</strong> and their place in the queue, for example #3.</li>
  </ol>
  <figure>
    <img src="{{img:p1-fullcard}}" alt="Class card showing the class is full, 2 people on the waiting list, and a Join Waiting List button" loading="lazy" style="max-width:380px">
    <figcaption>A full class. (Made to look full for this picture.)</figcaption>
  </figure>
  <figure>

<script>
const PRACTICE_URL = "https://mjones2420-netizen.github.io/lg-pilates-booking/?env=test";
const PARTS = [
  { title: "Start here", lessons: [{ id: "start", title: "How this hub works", noTick: true }] },
  { title: "Part 1 · The client's journey", lessons: [
    { id: "1.1", title: "Finding and booking a class" },
    { id: "1.2", title: "The priority booking window" },
    { id: "1.3", title: "Paying: card or bank transfer" },
    { id: "1.4", title: "The health form (PAR-Q)" },
    { id: "1.5", title: "Joining a waiting list" },
    { id: "1.6", title: "When a client wants to cancel" },
  ] },
  { title: "Part 2 · Everyday admin", lessons: [
    { id: "2.1", title: "Who's coming this week?" },
    { id: "2.2", title: "Mark a bank transfer paid" },
    { id: "2.3", title: "A client cancels" },
    { id: "2.4", title: "Swap class for one week" },
    { id: "2.5", title: "Offer a waiting-list space" },
  ] },
  { title: "Part 3 · Each new term", lessons: [
    { id: "3.1", title: "Set up next term's block" },
    { id: "3.2", title: "The changeover between terms" },
    { id: "3.3", title: "Email everyone on a block" },
    { id: "3.4", title: "Reading the Reports page" },
    { id: "3.5", title: "Finding a past booking" },
  ] },
  { title: "Part 4 · Occasional jobs", lessons: [
    { id: "4.1", title: "Bank details and your email" },
    { id: "4.2", title: "Card or bank transfer" },
    { id: "4.3", title: "Backups" },
    { id: "4.4", title: "Using it on your phone" },
  ] },
  { title: "Reference", lessons: [
    { id: "R.1", title: "Which emails go out when", noTick: true },
    { id: "R.2", title: "“A client says…”", noTick: true },
    { id: "R.3", title: "Glossary", noTick: true },
  ] },
];
const LESSONS = PARTS.flatMap(p => p.lessons || []);
const TICKABLE = LESSONS.filter(l => !l.noTick);

let current = "start";
let myDone = {};           // { lessonId: isoDate }
let everyone = [];         // [{ id, done }]
let db = null, me = null, userNs = null, canSave = false;
let writeChain = Promise.resolve();

try { const saved = localStorage.getItem("hub-lesson"); if (saved && LESSONS.some(l => l.id === saved)) current = saved; } catch (e) {}

function renderNav() {
  const body = document.getElementById("nav-body");
  body.textContent = "";
  PARTS.forEach(p => {
    const sec = document.createElement("div"); sec.className = "nav-part";
    const h = document.createElement("h3"); h.textContent = p.title; sec.appendChild(h);
    if (p.lessons) {
      const ul = document.createElement("ul");
      p.lessons.forEach(l => {
        const li = document.createElement("li");
        const b = document.createElement("button"); b.className = "nav-link"; b.type = "button";
        if (l.id === current) b.setAttribute("aria-current", "true");
        const t = document.createElement("span"); t.className = "tick" + (myDone[l.id] ? " on" : ""); t.textContent = "✓";
        if (l.noTick) t.style.visibility = "hidden";
        const s = document.createElement("span"); s.textContent = (l.noTick ? "" : l.id + "  ") + l.title;
        b.append(t, s);
        b.addEventListener("click", () => go(l.id));
        li.appendChild(b); ul.appendChild(li);
      });
      sec.appendChild(ul);
    } else {
      const soon = document.createElement("div"); soon.className = "nav-soon"; soon.textContent = "Coming soon";
      const ul = document.createElement("ul"); ul.className = "nav-soon-list";
      p.soon.forEach(x => { const li = document.createElement("li"); li.textContent = x; ul.appendChild(li); });
      sec.append(soon, ul);
    }
    body.appendChild(sec);
  });
  const n = TICKABLE.filter(l => myDone[l.id]).length;
  document.getElementById("nav-count").textContent = n + " / " + TICKABLE.length + " done";
}

function renderMain() {
  const main = document.getElementById("main");
  main.textContent = "";
  const page = document.createElement("article"); page.className = "page";
  page.appendChild(document.getElementById("L-" + current).content.cloneNode(true));
  page.querySelectorAll("a[data-try]").forEach(a => { a.href = PRACTICE_URL; a.target = "_blank"; a.rel = "noopener"; });

  const lesson = LESSONS.find(l => l.id === current);
  const idx = LESSONS.indexOf(lesson);
  const foot = document.createElement("div"); foot.className = "lesson-foot";
  if (!lesson.noTick) {
    const wrap = document.createElement("div");
    const btn = document.createElement("button"); btn.type = "button"; btn.id = "done-btn";
    const on = !!myDone[current];
    btn.className = "btn ghost done-btn" + (on ? " on" : "");
    btn.textContent = on ? "✓ Done" : "Mark as done";
    btn.disabled = !canSave;
    btn.addEventListener("click", () => toggleDone(current));
    wrap.appendChild(btn);
    if (!canSave) { const n = document.createElement("span"); n.className = "note"; n.style.marginLeft = "10px"; n.textContent = "Progress can't be saved in this view"; wrap.appendChild(n); }
    foot.appendChild(wrap);
  } else { foot.appendChild(document.createElement("span")); }
  const pager = document.createElement("div"); pager.className = "pager";
  if (idx > 0) { const p = document.createElement("button"); p.type = "button"; p.className = "btn ghost"; p.textContent = "← " + LESSONS[idx - 1].title; p.addEventListener("click", () => go(LESSONS[idx - 1].id)); pager.appendChild(p); }
  if (idx < LESSONS.length - 1) { const n = document.createElement("button"); n.type = "button"; n.className = "btn primary"; n.textContent = LESSONS[idx + 1].title + " →"; n.addEventListener("click", () => go(LESSONS[idx + 1].id)); pager.appendChild(n); }
  foot.appendChild(pager);
  page.appendChild(foot);
  main.appendChild(page);
  if (current === "start") renderTeam();
}

async function renderTeam() {
  const el = document.getElementById("team");
  if (!el) return;
  if (!db) { el.innerHTML = ""; const p = document.createElement("p"); p.className = "note"; p.textContent = "Progress tracking isn't available in this view."; el.appendChild(p); return; }
  const rows = everyone.filter(r => Object.keys(r.done || {}).length || r.id === me);
  if (me && !rows.some(r => r.id === me)) rows.unshift({ id: me, done: myDone });
  if (!rows.length) { el.innerHTML = ""; const p = document.createElement("p"); p.className = "note"; p.textContent = "Nobody has ticked off a lesson yet. Open lesson 1.1 to begin."; el.appendChild(p); return; }
  const profiles = userNs ? await userNs.profiles(rows.map(r => r.id)) : {};
  const holder = document.getElementById("team");
  if (!holder) return;
  holder.textContent = "";
  rows.forEach(r => {
    const done = TICKABLE.filter(l => (r.done || {})[l.id]).length;
    const pr = profiles[r.id] || {};
    const row = document.createElement("div"); row.className = "person";
    const img = document.createElement("img"); img.alt = ""; if (pr.avatarUrl) img.src = pr.avatarUrl;
    const mid = document.createElement("div"); mid.style.minWidth = "0";
    const nm = document.createElement("div"); nm.style.fontWeight = "600"; nm.style.fontSize = "14px";
    nm.textContent = r.id === me ? (pr.name ? pr.name + " (you)" : "You") : (pr.name || "Someone");
    const bar = document.createElement("div"); bar.className = "bar"; const fill = document.createElement("i"); fill.style.width = (100 * done / TICKABLE.length) + "%"; bar.appendChild(fill);
    mid.append(nm, bar);
    const num = document.createElement("div"); num.className = "num"; num.textContent = done + " of " + TICKABLE.length;
    row.append(img, mid, num);
    holder.appendChild(row);
  });
  renderReset();
}

// "Start again": clears the signed-in viewer's own ticks. Inline confirm (no window.confirm).
let resetAsk = false;
function renderReset() {
  const el = document.getElementById("reset");
  if (!el) return;
  el.textContent = "";
  const n = TICKABLE.filter(l => myDone[l.id]).length;
  if (!canSave || !n) { resetAsk = false; return; }
  if (!resetAsk) {
    const b = document.createElement("button"); b.type = "button"; b.className = "linkbtn"; b.id = "reset-btn";
    b.textContent = "Start again – clear my ticks";
    b.addEventListener("click", () => { resetAsk = true; renderReset(); });
    el.appendChild(b);
    return;
  }
  const q = document.createElement("span"); q.className = "note";
  q.textContent = "Clear all " + n + " tick" + (n === 1 ? "" : "s") + "? This can't be undone.";
  const yes = document.createElement("button"); yes.type = "button"; yes.className = "btn danger"; yes.id = "reset-yes"; yes.textContent = "Yes, clear";
  yes.addEventListener("click", clearAllDone);
  const no = document.createElement("button"); no.type = "button"; no.className = "btn ghost"; no.textContent = "Cancel";
  no.addEventListener("click", () => { resetAsk = false; renderReset(); });
  el.append(q, yes, no);
}

function clearAllDone() {
  if (!canSave) return;
  resetAsk = false;
  myDone = {};
  renderNav(); renderMain();
  writeChain = writeChain.then(() => db.doc("progress/" + me).set({ done: {} }))
    .catch(e => console.error("Clear failed", e));
}

function go(id) {
  current = id;
  try { localStorage.setItem("hub-lesson", id); } catch (e) {}
  renderNav(); renderMain();
  if (window.matchMedia("(max-width: 899px)").matches) document.getElementById("nav").open = false;
  window.scrollTo({ top: 0 });
}

function toggleDone(id) {
  if (!canSave) return;
  const next = Object.assign({}, myDone);
  if (next[id]) delete next[id]; else next[id] = new Date().toISOString().slice(0, 10);
  myDone = next;
  renderNav(); renderMain();
  writeChain = writeChain.then(() => db.doc("progress/" + me).set({ done: next }))
    .catch(e => {
      console.error("Save failed", e);
      if (e && e.code === "invalid_argument") { canSave = false; renderMain(); }
    });
}

if (window.matchMedia("(min-width: 900px)").matches) document.getElementById("nav").open = true;
renderNav(); renderMain();

(async () => {
  if (!window.claude || !window.claude.use) return;
  const [dbNs, u] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
  db = dbNs; userNs = u;
  if (!db || !u) { renderMain(); return; }
  me = await u.id();
  const can = await u.can("data.write");
  canSave = !!me && can !== false;
  db.collection("progress").onSnapshot(snap => {
    everyone = snap.docs.map(d => ({ id: d.id, done: (d.data() || {}).done || {} }));
    const mine = everyone.find(r => r.id === me);
    const incoming = mine ? mine.done : {};
    if (JSON.stringify(incoming) !== JSON.stringify(myDone) && !snap.metadata.hasPendingWrites) myDone = incoming;
    renderNav(); renderMain();
  }, err => console.error("Progress feed stopped", err));
  renderMain();
})();
</script>
